services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wellness_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wellness_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wellness_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wellness_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Direct connection to the docker db service container
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/wellness_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Cache Hugging Face embeddings model so it downloads only once across container restarts
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  hf_cache:
